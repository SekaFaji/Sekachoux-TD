<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#29190f">
  <meta name="description" content="Sekachoux TD: Bakery Defense. Build a pastry army and defend the bakery against hungry customers.">
  <title>Sekachoux TD - Bakery Defense</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">
    <div id="stage" aria-label="Sekachoux TD landscape game">
      <section id="menu" class="screen active" aria-label="Main menu">
        <canvas id="menu-art" aria-hidden="true" width="160" height="90"></canvas>
        <div id="title-block"><h1>SEKACHOUX <span>TD</span></h1><p>BAKERY DEFENSE</p></div>
        <nav id="main-actions" aria-label="Main menu actions">
          <button class="wood-button" data-action="adventure">Start Baking</button>
          <button class="wood-button" data-action="levels">Level Select</button>
          <button class="wood-button" data-action="almanac">Bakery Almanac</button>
          <button class="wood-button" disabled>Survival - Coming Soon</button>
        </nav>
        <button class="small-button menu-fullscreen" data-action="fullscreen">Fullscreen</button>
      </section>
      <section id="level-screen" class="screen panel-screen" aria-label="Level select">
        <h2>Start Baking</h2><p class="panel-caption">Complete a shift to unlock the next pastry and level.</p>
        <div id="level-list"></div>
        <button class="wood-button" data-action="menu">Back to Bakery</button>
      </section>
      <section id="almanac-screen" class="screen panel-screen" aria-label="Bakery almanac">
        <h2>Bakery Almanac</h2><div id="almanac-list"></div>
        <button class="wood-button" data-action="menu">Back to Bakery</button>
      </section>
      <section id="game-screen" class="screen" aria-label="Bakery defense game">
        <header id="toolbar">
          <div id="butter-counter" aria-label="Butter resource"><img id="butter-icon" alt="" width="32" height="32"><span id="butter-value">0</span><small>BUTTER</small></div>
          <div id="defender-cards" aria-label="Choose a pastry"></div>
          <div id="toolbar-controls">
            <button class="tool-card" id="shovel" data-action="shovel" aria-label="Remove pastry" title="Remove pastry"><img id="shovel-icon" alt="" width="32" height="32"></button>
            <button class="small-button" data-action="pause">Pause</button>
          </div>
        </header>
        <div id="battle-area">
          <canvas id="battlefield" width="288" height="160" aria-label="Tap a tile to place a pastry"></canvas>
          <div id="level-label"></div>
          <div id="banner" role="status" aria-live="polite"></div>
          <div id="tutorial-tip" role="status" aria-live="polite"></div>
          <div id="selected-info" aria-live="polite"><strong id="selected-name"></strong><span id="selected-description"></span></div>
          <div id="level-progress"><i id="progress-fill"></i></div>
          <div id="lane-reveal" aria-hidden="true"></div>
        </div>
      </section>
      <section id="level-preview" class="screen interstitial" role="dialog" aria-modal="true" aria-label="Today's customers">
        <div class="preview-heading"><small id="preview-level"></small><h2>TODAY'S CUSTOMERS</h2><p id="preview-lesson"></p></div>
        <div id="preview-enemies" class="preview-lineup"></div>
        <div class="preview-foot"><span>THE BAKERY OPENS SOON</span><button class="wood-button" data-action="start-bake">OPEN THE BAKERY</button></div>
      </section>
      <section id="modal" class="screen overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-card"><h2 id="modal-title"></h2><p id="modal-message"></p>
          <div id="reward-feature" hidden><span class="reward-ribbon">NEW PASTRY UNLOCKED</span><img id="reward-image" width="64" height="64" alt=""><div><strong id="reward-name"></strong><p id="reward-description"></p></div></div>
          <button id="modal-primary" class="wood-button"></button>
          <button id="modal-secondary" class="wood-button"></button>
        </div>
      </section>
    </div>
    <p id="orientation-hint">Landscape view - rotate your phone for a larger game.</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
